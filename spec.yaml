# OpenAPI 3.0.3 (not 3.1): oapi-codegen does not yet support 3.1.x and warns on
# it; this spec uses no 3.1-only features, so 3.0.3 is the precise version and
# keeps codegen + kin-openapi validation warning-free. See docs/design.md §3.
openapi: 3.0.3
info:
  version: 1.0.0
  title: Equipment Exposure Service
paths:
  /exposure:
    get:
      summary: Retrieve a collection of exposure resources
      operationId: getExposures
      responses:
        "200":
          description: The collection of exposure resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Exposure"
        default:
          $ref: "#/components/responses/InternalServerError"
    post:
      summary: Record an exposure
      operationId: recordExposure
      requestBody:
        $ref: "#/components/requestBodies/ExposurePost"
      responses:
        "201":
          description: The created exposure resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exposure"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/InternalServerError"

  /exposure/{exposureId}:
    get:
      summary: Retrieve an exposure resource
      operationId: getExposure
      parameters:
        - name: exposureId
          required: true
          in: path
          schema:
            type: string
            format: uuid
            example: "e8f7b50c-cc18-42f9-a275-0b4ead73f806"
      responses:
        # Corrected from the supplied spec's "201": a GET that returns an
        # existing resource is 200, not 201 (Created). See docs/design.md §3.
        "200":
          description: The matching exposure resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exposure"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/InternalServerError"

  /users/{userId}/exposure-summary:
    get:
      summary: Retrieve the exposure summary for a user
      operationId: getUserExposureSummary
      parameters:
        - name: userId
          required: true
          in: path
          schema:
            type: string
            format: uuid
            example: "713be58e-0d79-4df2-a85c-9f44ca513a7d"
        # Corrected from the supplied spec's "format: date": the examples are
        # RFC3339 date-times and exposure windows need exact instants/timezone,
        # which a calendar date cannot express. See docs/design.md §3.
        - name: starting_at
          required: false
          in: query
          schema:
            type: string
            format: date-time
            example: "2025-01-01T00:00:00Z"
        - name: ending_at
          required: false
          in: query
          schema:
            type: string
            format: date-time
            example: "2025-01-31T23:59:59Z"
      responses:
        "200":
          description: The summary payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExposureSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/InternalServerError"

components:
  requestBodies:
    ExposurePost:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              equipment_id:
                type: string
                format: uuid
                example: "2e85d43d-dd9b-4e8d-b2ce-97b8d7d69d49"
              duration:
                type: integer
                description: The duration of the exposure (in minutes)
                example: 5
              user_id:
                type: string
                format: uuid
                example: "713be58e-0d79-4df2-a85c-9f44ca513a7d"
  # Added (not in the supplied spec): a shared error response contract so the
  # error surface is part of the spec and can be validated. See docs/design.md §3.
  responses:
    BadRequest:
      description: The request was malformed, or a required field was missing or had an invalid format
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: The request was well-formed but contained a semantically invalid value
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: An unexpected error occurred
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Exposure:
      type: object
      required: [id, equipment, duration, a8, points, user]
      properties:
        id:
          type: string
          format: uuid
          example: "e8f7b50c-cc18-42f9-a275-0b4ead73f806"
        equipment:
          $ref: "#/components/schemas/EquipmentItem"
        duration:
          type: integer
          description: The duration of the exposure (in minutes)
          example: 5
        a8:
          type: number
          description: The A8 value for the exposure
          example: 1.25
        points:
          type: number
          description: The partial exposure of points
          example: 25.1
        user:
          $ref: "#/components/schemas/User"
    ExposureSummary:
      type: object
      required: [a8, points, user]
      properties:
        a8:
          type: number
          description: The A8 value for the exposure
          example: 1.25
        points:
          type: number
          description: The partial exposure of points
          example: 25.1
        user:
          $ref: "#/components/schemas/User"
    User:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
          example: "713be58e-0d79-4df2-a85c-9f44ca513a7d"
        name:
          type: string
          example: "Bobby Tables"
    EquipmentItem:
      type: object
      required: [id, name, vibration_magnitude]
      properties:
        id:
          type: string
          format: uuid
          example: "2e85d43d-dd9b-4e8d-b2ce-97b8d7d69d49"
        name:
          type: string
          example: "AirCat - Drill - 4337"
        vibration_magnitude:
          type: number
          example: 2.1
    # Added (not in the supplied spec): the body returned by all error responses.
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: A short, machine-readable error slug
          example: "exposure_not_found"
        message:
          type: string
          description: A human-readable description of the error
          example: "no exposure with that id"
